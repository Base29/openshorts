[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shortify"
version = "0.1.0"
description = "CLI for Shortify Agent: clip long videos into vertical shorts and publish them, from the terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shortify Agent" }]
keywords = ["video", "clips", "shorts", "ai", "tiktok", "youtube-shorts", "cli", "agent"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://www.shortifyagent.app"
Source = "https://github.com/mutonby/openshorts"
Documentation = "https://www.shortifyagent.app/mcp"

[project.scripts]
shortify = "openshorts_cli:main"
openshorts = "openshorts_cli:main"

[tool.setuptools]
py-modules = ["openshorts_cli"]
